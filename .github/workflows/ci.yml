name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate, test, verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out Bootstrap v6-dev
        uses: actions/checkout@v4
        with:
          repository: twbs/bootstrap
          ref: v6-dev
          path: bootstrap-v6-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate the token document
        run: node tools/cli.mjs validate

      # Fails when upstream offers a configurable surface we neither model nor have
      # explicitly decided to ignore. Two token maps went missing for the life of the
      # project before this check existed.
      - name: Check coverage against upstream
        run: node tools/cli.mjs sync --check --src "$GITHUB_WORKSPACE/bootstrap-v6-dev"

      - run: npm test
        env:
          BOOTSTRAP_SRC: ${{ github.workspace }}/bootstrap-v6-dev

      - name: Build
        run: node tools/cli.mjs build

      - name: Fail if build output is stale
        run: |
          if ! git diff --quiet -- build docs/token-inventory.md; then
            echo "::error::build/ is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- build docs/token-inventory.md
            exit 1
          fi

      # A theme is judged on what it changed. With no theme file this asserts that the
      # document itself introduces nothing — which is the baseline every theme is measured
      # against, so it has to hold.
      - name: Contrast audit
        run: node tools/cli.mjs report --fail-on introduced --out /dev/null

      # The point of the whole pipeline: our export must compile to the same CSS
      # as upstream's own entrypoint.
      - name: Verify byte-identical CSS
        run: node tools/cli.mjs verify --src "$GITHUB_WORKSPACE/bootstrap-v6-dev"

      # And the maintainer route must reach that same CSS by patching upstream's sources.
      - name: Verify the maintainer export
        run: |
          cat > /tmp/theme.json <<'JSON'
          {
            "format": "bootstrap-tokens-theme@1",
            "overrides": {
              "color.blue.base": { "value": "oklch(58% 0.19 28)" },
              "spacing.base": { "value": "1.25rem" },
              "alert.border-radius": { "value": "{radius.9}" },
              "theme-color.warning.fg": { "value": "{color.amber.700}", "dark": "{color.amber.300}" }
            }
          }
          JSON
          node tools/cli.mjs eject --theme /tmp/theme.json --src "$GITHUB_WORKSPACE/bootstrap-v6-dev" --verify
