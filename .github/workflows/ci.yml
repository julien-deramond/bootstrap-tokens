name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate, test, verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Bootstrap v6-dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: twbs/bootstrap
          ref: v6-dev
          path: bootstrap-v6-dev

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate the token document
        run: node tools/cli.mjs validate

      # Fails when upstream offers a configurable surface we neither model nor have
      # explicitly decided to ignore. Two token maps went missing for the life of the
      # project before this check existed.
      - name: Check coverage against upstream
        run: node tools/cli.mjs sync --check --src "$GITHUB_WORKSPACE/bootstrap-v6-dev"

      - run: npm test
        env:
          BOOTSTRAP_SRC: ${{ github.workspace }}/bootstrap-v6-dev

      - name: Build
        run: node tools/cli.mjs build

      - name: Fail if build output is stale
        run: |
          if ! git diff --quiet -- build docs/token-inventory.md; then
            echo "::error::build/ is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- build docs/token-inventory.md
            exit 1
          fi

      # A theme is judged on what it changed. With no theme file this asserts that the
      # document itself introduces nothing — which is the baseline every theme is measured
      # against, so it has to hold.
      - name: Contrast and colour-vision audit
        run: node tools/cli.mjs report --fail-on vision --out /dev/null

      # The point of the whole pipeline: our export must compile to the same CSS
      # as upstream's own entrypoint.
      - name: Verify byte-identical CSS
        run: node tools/cli.mjs verify --src "$GITHUB_WORKSPACE/bootstrap-v6-dev"

      # And the maintainer route must reach that same CSS by patching upstream's sources.
      - name: Verify the maintainer export
        run: |
          cat > /tmp/theme.json <<'JSON'
          {
            "format": "bootstrap-tokens-theme@1",
            "overrides": {
              "color.blue.base": { "value": "oklch(58% 0.19 28)" },
              "spacing.base": { "value": "1.25rem" },
              "alert.border-radius": { "value": "{radius.9}" },
              "theme-color.warning.fg": { "value": "{color.amber.700}", "dark": "{color.amber.300}" }
            }
          }
          JSON
          node tools/cli.mjs eject --theme /tmp/theme.json --src "$GITHUB_WORKSPACE/bootstrap-v6-dev" --verify

  # The Theme Builder is a static app that reads the built token document, so the deployable
  # site is just the repository's own shape with the unused parts left out. Gated on `check`:
  # a build that fails verification should not become the live one.
  deploy:
    name: Deploy the Theme Builder
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    # One live site, so deployments queue rather than race — and never cancel a half-finished
    # one, which would leave Pages serving whatever it had got to.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out Bootstrap v6-dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: twbs/bootstrap
          ref: v6-dev
          path: bootstrap-v6-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the tokens
        run: node tools/cli.mjs build

      # The preview iframe renders real Bootstrap markup against real Bootstrap CSS.
      - name: Compile the preview stylesheet
        run: node tools/cli.mjs vendor --src "$GITHUB_WORKSPACE/bootstrap-v6-dev"

      - name: Assemble the site
        run: node tools/cli.mjs site

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
