version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Paris'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    groups:
      npm:
        patterns:
          - '*'
        # Bootstrap gets a pull request of its own. A bump changes what tokens/ is extracted
        # from, so it needs `npm run sync && npm run build` committed on top, and CI's
        # `sync --check` stays red until that is done. Prereleases are offered without any
        # setting: the pinned version is itself a prerelease, above the `latest` dist-tag.
        exclude-patterns:
          - 'bootstrap'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Paris'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    groups:
      github-actions:
        patterns:
          - '*'
