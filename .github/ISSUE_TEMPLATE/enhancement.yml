name: Enhancement
description: Something that exists should work better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Every open issue is available to pick up, so the more it says, the sooner it moves — see
        [CONTRIBUTING.md](https://github.com/julien-deramond/bootstrap-tokens/blob/main/CONTRIBUTING.md#issues).

  - type: textarea
    id: today
    attributes:
      label: How it behaves today
      description: The current behavior, and where it lives.
    validations:
      required: true

  - type: textarea
    id: better
    attributes:
      label: What would be better
      description: The change, and what it buys whoever hits this.
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: What it might break
      description: Committed `build/` output, the export contract, the Theme Builder - say if you know.
    validations:
      required: false
