name: Feature
description: A capability that does not exist yet.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: >-
        Every open issue is available to pick up, so the more it says, the sooner it moves — see
        [CONTRIBUTING.md](https://github.com/julien-deramond/bootstrap-tokens/blob/main/CONTRIBUTING.md#issues).

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What someone cannot do today, and who that someone is.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: >-
        What you think should exist. Name the files or the commands it would touch if you
        already know them.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Out of scope / open questions
      description: What this deliberately does not cover, and what still needs deciding.
    validations:
      required: false
