<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview</title>
    <link rel="stylesheet" href="./vendor/bootstrap.css" />
    <style id="token-overrides"></style>
    <style>
      /*
       * The canvas.
       *
       * The previews used to be full-bleed panels, which read as more of the tool — three
       * adjacent surfaces of similar tone, with nothing saying which one was the interface
       * and which was the output. They are artefacts being looked at, so they now sit on a
       * neutral ground belonging to neither colour scheme, framed and labelled, the way any
       * design tool renders an artboard.
       *
       * These values deliberately do not come from Bootstrap's tokens: the ground has to
       * stay put while the theme standing on it changes.
       */
      :root {
        --canvas: #e6e8ec;
        --canvas-line: #cfd4dc;
        --canvas-ink: #5c6370;
        --artboard-shadow: 0 1px 2px rgb(16 18 22 / 10%), 0 10px 28px rgb(16 18 22 / 10%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #22252b;
          --canvas-line: #3a3f48;
          --canvas-ink: #9aa2b1;
          --artboard-shadow: 0 1px 2px rgb(0 0 0 / 50%), 0 10px 28px rgb(0 0 0 / 45%);
        }
      }

      body {
        margin: 0;
        background: var(--canvas);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /*
       * The artboards are bounded and scroll internally, rather than running off the bottom
       * of the viewport. An object whose top and bottom edges you can both see reads as a
       * thing being looked at; one that fills the column edge to edge reads as another panel
       * of the application — which was the complaint.
       */
      #preview-root {
        display: grid;
        gap: 1.25rem;
        padding: 1.25rem;
        block-size: 100vh;
        box-sizing: border-box;
        align-items: stretch;
      }

      .preview-split { grid-template-columns: 1fr 1fr; }

      /* Stacked, the two artboards cannot both fill the frame — so each keeps a bounded
         height and the canvas scrolls between them, rather than one running off the end. */
      @media (width < 52rem) {
        /* `#preview-root` outranks a class selector, so the height override has to carry
           the id too or the stacked boards are squashed into one viewport and overlap. */
        #preview-root { block-size: auto; }
        .preview-split { grid-template-columns: 1fr; }
        .preview-split .artboard { block-size: 70vh; flex: none; }
      }

      .board {
        display: flex;
        flex-direction: column;
        min-inline-size: 0;
        min-block-size: 0;
        margin: 0;
      }

      /* On the canvas, not inside the artboard — otherwise it reads as one of the sample's
         own section headings, which are set in the same small caps. */
      .board-label {
        display: flex;
        gap: .4375rem;
        align-items: center;
        margin: 0 0 .4375rem .125rem;
        font-size: .6875rem;
        font-weight: 600;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--canvas-ink);
      }

      .board-swatch {
        inline-size: .625rem;
        block-size: .625rem;
        border: 1px solid var(--canvas-line);
        border-radius: 50%;
      }

      .board-light .board-swatch { background: #fff; }
      .board-dark .board-swatch { background: #16181d; }

      .artboard {
        flex: 1;
        min-block-size: 0;
        overflow: auto;
        background: var(--bg-body);
        border: 1px solid var(--canvas-line);
        border-radius: .625rem;
        box-shadow: var(--artboard-shadow);
      }

      /*
       * The artboard stands in for `body`, so it has to carry what Bootstrap puts on `body`.
       *
       * The canvas font above is the label chrome's, and it was winning: both rules target
       * `body`, the preview's comes last, and the `font` shorthand resets family, size and
       * line height together. So the artboards rendered at 13px system sans whatever the
       * theme said — which made every typography token invisible in the one place they are
       * meant to be visible.
       */
      .pane {
        padding: 1.125rem;
        font-family: var(--body-font-family);
        font-size: var(--body-font-size);
        font-weight: var(--body-font-weight);
        line-height: var(--body-line-height);
        color: var(--fg-body);
        text-align: var(--body-text-align);
        background: var(--bg-body);
      }

      .preview-section { scroll-margin-block-start: 1.5rem; border-radius: .5rem; }
      .preview-section + .preview-section { margin-block-start: 1.75rem; }

      .preview-section > h2 {
        margin-block-end: .625rem;
        font-size: .6875rem;
        font-weight: 600;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--fg-3);
      }

      .preview-section.is-focused { animation: flash 1.4s ease-out; }

      /*
       * A specimen box. Overlays are positioned against the viewport and hidden until
       * JavaScript shows them, so they are put in flow here to be looked at. `transform`
       * makes the box a containing block for `position: fixed`, and `contain: layout`
       * keeps an absolutely positioned child inside it.
       *
       * Only positioning and visibility are touched. Neither is something a theme sets, so
       * every token these components carry is still the theme's.
       */
      .specimen {
        min-inline-size: 12rem;
        margin: 0;
        transform: translate(0);
      }

      .specimen > figcaption {
        margin-block-end: .375rem;
        font-size: .6875rem;
        font-weight: 600;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--fg-3);
      }

      .specimen .menu,
      .specimen .tooltip,
      .specimen .popover,
      .specimen .dialog,
      .specimen .drawer {
        position: static;
        inset: auto;
        visibility: visible;
        opacity: 1;
        max-inline-size: none;
        max-block-size: none;
        margin: 0;
        transform: none;
      }

      /* The tooltip and popover arrows point at nothing here, and an arrow with no anchor
         reads as a rendering fault rather than as part of the component. */
      .specimen .tooltip-arrow,
      .specimen .popover-arrow { display: none; }

      /* Only the artboard is simulated; the frame and its label stay legible. */
      .pane[data-vision] { filter: var(--vision-filter); }

      /* The empty state for "your markup". Dashed, so it reads as a placeholder rather
         than as a component the theme drew. */
      .preview-empty {
        padding: 2rem 1.5rem;
        border: 1px dashed var(--border-color);
        border-radius: .5rem;
        color: var(--fg-2);
        text-align: center;
      }
      .preview-empty p { margin: 0 0 .5rem; }
      .preview-empty p:last-child { margin-block-end: 0; }

      @keyframes flash {
        0%, 40% { box-shadow: 0 0 0 4px var(--primary-focus-ring); background: var(--bg-1); }
        100% { box-shadow: 0 0 0 4px transparent; background: transparent; }
      }

      @media (prefers-reduced-motion: reduce) {
        .preview-section.is-focused { animation: none; outline: 3px solid var(--primary-base); }
      }

      .cluster { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
      .mt { margin-block-start: .5rem; }
      .mb { margin-block-end: .75rem; }
      .alert { margin-block-end: .5rem; }

      .preview-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
      .preview-row > * { flex: 1 1 12rem; min-width: 0; }
      .card { max-width: 20rem; }

      .elevation-row { display: flex; flex-wrap: wrap; gap: 1rem; padding-block: .5rem 1rem; }

      .elevation-box {
        display: grid;
        place-items: center;
        inline-size: 5rem;
        block-size: 3.5rem;
        font-size: .75rem;
        color: var(--fg-3);
        background: var(--bg-body);
        border: var(--border-width) solid var(--border-subtle);
        border-radius: var(--radius-6);
      }

      .surface-row { display: flex; gap: .5rem; margin-block-start: .75rem; }

      .surface {
        flex: 1;
        padding: .75rem;
        font-size: .75rem;
        border: var(--border-width) solid var(--border-subtle);
        border-radius: var(--radius-5);
      }

      .swatch-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; }
      .swatch-grid > div { height: 1.5rem; border-radius: 2px; }
      .swatch-row { display: grid; grid-template-columns: 3.25rem 1fr; gap: .5rem; align-items: center; margin-block-end: 2px; }
      .swatch-row > span { font-size: .6875rem; color: var(--fg-3); }

      /* --- page scenario --- */
      /* The page scenario is shared with the project `bstokens init` writes, so it lays
         itself out with Bootstrap's own rows and utilities rather than with chrome defined
         here. The one thing it still needs undone is the card cap above, which exists so a
         lone card in the gallery does not stretch across the artboard; in a three-column
         row it would stop the cards filling their columns. */
      .preview-section[data-section="page"] .card { max-width: none; }

      /* --- states scenario --- */
      .state-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1rem; }

      .state-label {
        margin: 0 0 .375rem;
        font-size: .625rem;
        font-weight: 600;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--fg-4);
      }

      .state-empty {
        padding: 1rem;
        text-align: center;
        border: var(--border-width) dashed var(--border-muted);
        border-radius: var(--radius-6);
      }
    </style>
  </head>
  <body>
    <!--
      Colour-vision simulation.

      Applied to the artboard, never to the chooser's own chrome: the point is to look at
      the artefact through someone else's eyes, and simulating the tool as well would just
      make the tool hard to use.

      These matrices are the Viénot/Brettel approximations, and they are derived for
      *linear* light — which is why `color-interpolation-filters` is left alone. SVG's
      default is linearRGB; forcing sRGB here, as a lot of copies of these filters do,
      applies a linear-light transform to gamma-encoded values and produces a simulation
      that is wrong in the direction of "not as bad as it really is".

      A simulation shows what is lost. It cannot tell you a design is fine, only that a
      distinction you were relying on has gone.
    -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <filter id="vision-protanopia">
        <feColorMatrix type="matrix" values="
          0.567 0.433 0     0 0
          0.558 0.442 0     0 0
          0     0.242 0.758 0 0
          0     0     0     1 0" />
      </filter>
      <filter id="vision-deuteranopia">
        <feColorMatrix type="matrix" values="
          0.625 0.375 0    0 0
          0.700 0.300 0    0 0
          0     0.300 0.70 0 0
          0     0     0    1 0" />
      </filter>
      <filter id="vision-tritanopia">
        <feColorMatrix type="matrix" values="
          0.950 0.050 0     0 0
          0     0.433 0.567 0 0
          0     0.475 0.525 0 0
          0     0     0     1 0" />
      </filter>
      <filter id="vision-achromatopsia">
        <feColorMatrix type="matrix" values="
          0.299 0.587 0.114 0 0
          0.299 0.587 0.114 0 0
          0.299 0.587 0.114 0 0
          0     0     0     1 0" />
      </filter>
    </svg>

    <div id="preview-root"></div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
