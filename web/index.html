<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap token chooser</title>
    <meta name="description" content="Design a Bootstrap v6 theme and export it as Sass." />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <div class="theme-picker">
            <button type="button" class="theme-name" id="theme-name" aria-expanded="false" aria-controls="theme-menu">
              <span id="theme-name-text">Loading…</span>
              <svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="m2 4.5 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="theme-menu" id="theme-menu" hidden>
              <ul id="theme-list"></ul>
              <div class="theme-menu-actions">
                <button type="button" class="chip-button" id="theme-new">New</button>
                <button type="button" class="chip-button" id="theme-duplicate">Duplicate</button>
                <button type="button" class="chip-button" id="theme-rename">Rename</button>
                <button type="button" class="chip-button" id="theme-delete">Delete</button>
              </div>
            </div>
          </div>
          <p class="brand-sub" id="brand-sub">Loading…</p>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="health-wrap">
          <button type="button" class="health" id="health" aria-expanded="false" aria-controls="health-detail" hidden></button>
          <div class="health-detail" id="health-detail" hidden>
            <p class="health-detail-head" id="health-detail-head"></p>
            <ul id="health-list"></ul>
          </div>
        </div>

        <div class="icon-group" role="group" aria-label="History">
          <button type="button" class="icon-button" id="undo" title="Undo (⌘Z)" aria-label="Undo" disabled><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h7a3.5 3.5 0 0 1 0 7H7"/><path d="M6 4 3 7l3 3"/></svg></button>
          <button type="button" class="icon-button" id="redo" title="Redo (⇧⌘Z)" aria-label="Redo" disabled><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 7H6a3.5 3.5 0 0 0 0 7h3"/><path d="m10 4 3 3-3 3"/></svg></button>
        </div>

        <button type="button" class="button" id="reset" disabled>Reset all</button>
        <button type="button" class="button button-primary" id="open-export">Export…</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel" aria-label="Theme controls">
        <div class="panel-tabs" role="tablist" id="mode">
          <button type="button" role="tab" id="tab-simple" aria-controls="simple" data-mode="simple" aria-selected="true">Design</button>
          <button type="button" role="tab" id="tab-advanced" aria-controls="advanced" data-mode="advanced" aria-selected="false" tabindex="-1">All tokens</button>
        </div>

        <div class="panel-body">
          <div id="simple" role="tabpanel" aria-labelledby="tab-simple" tabindex="0"></div>

          <div id="advanced" role="tabpanel" aria-labelledby="tab-advanced" tabindex="0" hidden>
            <div class="rail-search">
              <input type="search" id="search" placeholder="Search 1197 tokens…" aria-label="Search tokens" autocomplete="off" />
            </div>
            <div class="advanced-split">
              <nav class="rail" id="rail" aria-label="Token groups"></nav>
              <div class="editor">
                <div class="editor-head">
                  <h2 id="section-title"></h2>
                  <p id="section-note"></p>
                  <p class="section-warning" id="section-warning" hidden></p>
                </div>
                <div class="editor-body" id="editor"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="preview" aria-label="Live preview">
        <div class="preview-head">
          <div class="segmented" id="scenario" role="group" aria-label="What to preview">
            <button type="button" data-scenario="components">Components</button>
            <button type="button" data-scenario="page">Page</button>
            <button type="button" data-scenario="states">States</button>
          </div>
          <div class="segmented" id="scheme" role="group" aria-label="Preview colour scheme">
            <button type="button" data-scheme="light">Light</button>
            <button type="button" data-scheme="dark">Dark</button>
            <button type="button" data-scheme="split">Side by side</button>
          </div>
          <div class="changes-wrap">
            <button type="button" class="chip" id="change-count" aria-expanded="false" aria-controls="changes-detail">no changes</button>
            <div class="changes-detail" id="changes-detail" hidden>
              <p class="changes-head" id="changes-head"></p>
              <ul id="changes-list"></ul>
            </div>
          </div>
        </div>
        <iframe id="preview" title="Bootstrap components preview" src="./preview.html"></iframe>
      </section>
    </main>

    <dialog id="export" class="export">
      <form method="dialog" class="export-head">
        <h2>Export your theme</h2>
        <button class="button" value="close" aria-label="Close">Close</button>
      </form>

      <div class="tabs" role="tablist" id="export-tabs">
        <button type="button" role="tab" id="tab-scss" aria-controls="export-panel" data-tab="scss" aria-selected="true">custom.scss</button>
        <button type="button" role="tab" id="tab-css" aria-controls="export-panel" data-tab="css" aria-selected="false" tabindex="-1">theme.css</button>
        <button type="button" role="tab" id="tab-json" aria-controls="export-panel" data-tab="json" aria-selected="false" tabindex="-1">theme.json</button>
        <button type="button" role="tab" id="tab-sources" aria-controls="export-panel" data-tab="sources" aria-selected="false" tabindex="-1">v6-dev sources</button>
      </div>

      <div id="export-panel" role="tabpanel" class="export-panel">
        <p class="export-note" id="export-note"></p>
        <ol class="export-steps" id="export-steps" hidden></ol>
        <pre class="export-code" tabindex="0"><code id="export-code"></code></pre>
      </div>

      <p class="export-message" id="export-message" role="alert" hidden></p>

      <div class="export-actions">
        <button type="button" class="button button-primary" id="download">Download</button>
        <button type="button" class="button" id="copy">Copy</button>
        <button type="button" class="button" id="share">Copy share link</button>
        <label class="button">
          Import a theme
          <input type="file" id="import" accept="application/json,.json,.scss,text/plain" hidden />
        </label>
      </div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
